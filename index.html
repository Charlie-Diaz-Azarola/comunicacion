<style>
  :root {
    --fondo-1: #2b0a10;
    --fondo-2: #4a1420;
    --papel: #fbf7ee;
    --papel-borde: #e6dcc6;
    --tinta: #2a2420;
    --tinta-suave: #5c5148;
    --granate: #7a1f2b;
    --oro: #b08d57;
    --oro-claro: #d8bf8a;
    --sombra: 0 30px 80px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.25);
    --serif-titulo: "Cormorant Garamond", "Garamond", Georgia, serif;
    --serif-texto: "EB Garamond", "Garamond", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--tinta);
    font-family: var(--serif-texto);
    background-color: var(--fondo-1);
    background-image:
      radial-gradient(ellipse at 50% -10%, rgba(216,191,138,.18), transparent 60%),
      radial-gradient(ellipse at 50% 120%, rgba(0,0,0,.5), transparent 60%),
      linear-gradient(160deg, var(--fondo-2), var(--fondo-1) 70%);
    background-attachment: fixed;
  }
  body.cerrado { overflow: hidden; }

  /* ---------- Portada (sobre que se abre) ---------- */
  #portada {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
    background:
      radial-gradient(ellipse at center, rgba(216,191,138,.16), transparent 65%),
      linear-gradient(160deg, var(--fondo-2), var(--fondo-1) 75%);
    transition: opacity 1.2s ease, visibility 1.2s ease;
  }
  #portada.fuera { opacity: 0; visibility: hidden; }
  .sello {
    text-align: center; color: var(--papel); max-width: 560px;
    animation: aparecer 1.6s ease both;
  }
  .sello .ornamento { width: 92px; height: 92px; color: var(--oro-claro); margin: 0 auto 18px; display: block; }
  .sello .antetitulo {
    font-family: var(--serif-titulo); letter-spacing: .28em; text-transform: uppercase;
    font-size: .82rem; color: var(--oro-claro); margin: 0 0 14px;
  }
  .sello h1 {
    font-family: var(--serif-titulo); font-weight: 600; margin: 0 0 34px;
    font-size: clamp(1.6rem, 1.1rem + 2.2vw, 2.4rem); line-height: 1.25;
    text-wrap: balance;
  }
  .sello .para { font-style: italic; font-size: 1.15rem; color: #eadfcb; margin: 0 0 34px; }
  .boton-abrir {
    font-family: var(--serif-titulo); font-size: 1.15rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--fondo-1); background: linear-gradient(180deg, #e7d3a6, var(--oro));
    border: 0; border-radius: 999px; padding: 14px 34px; cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.5);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .boton-abrir:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.5); }
  .boton-abrir:focus-visible, .barra button:focus-visible, .acciones button:focus-visible { outline: 2px solid var(--oro-claro); outline-offset: 3px; }
  .sello .nota { margin-top: 18px; font-size: .9rem; color: #cbb9a0; font-style: italic; }

  /* ---------- Carta ---------- */
  main {
    max-width: 780px; margin: 0 auto;
    padding: clamp(16px, 4vw, 48px) 16px 120px;
  }
  .carta {
    position: relative;
    background: var(--papel);
    background-image: radial-gradient(ellipse at top, #fffdf8, var(--papel) 70%);
    border-radius: 6px;
    box-shadow: var(--sombra);
    padding: clamp(28px, 6vw, 72px) clamp(20px, 6vw, 72px) clamp(36px, 6vw, 64px);
    overflow: hidden;
  }
  .carta::before {
    content: ""; position: absolute; inset: 10px; pointer-events: none;
    border: 1px solid var(--papel-borde); border-radius: 3px;
  }
  .imagen-portada { margin: calc(-1 * clamp(28px, 6vw, 72px)) calc(-1 * clamp(20px, 6vw, 72px)) 32px; position: relative; }
  .imagen-portada img { display: block; width: 100%; max-height: 420px; object-fit: cover; }
  .imagen-portada::after { content: ""; position: absolute; inset: auto 0 0 0; height: 22%; background: linear-gradient(transparent, var(--papel)); }

  header.cabecera { text-align: center; margin-bottom: clamp(24px, 4vw, 40px); }
  .cabecera .ornamento { width: 64px; height: 64px; color: var(--oro); display: block; margin: 0 auto 14px; }
  .cabecera .antetitulo {
    font-family: var(--serif-titulo); letter-spacing: .26em; text-transform: uppercase;
    color: var(--oro); font-size: .8rem; margin: 0 0 10px; font-weight: 600;
  }
  .cabecera h1 {
    font-family: var(--serif-titulo); color: var(--granate); font-weight: 700;
    font-size: clamp(1.9rem, 1.2rem + 3vw, 3rem); line-height: 1.12; margin: 0 0 12px;
  }
  .cabecera .para { font-style: italic; color: var(--tinta-suave); margin: 0 0 4px; font-size: 1.1rem; }
  .cabecera .fecha { color: var(--tinta-suave); font-size: .98rem; margin: 0; }

  .filete { display: flex; align-items: center; gap: 14px; margin: 26px auto; max-width: 320px; color: var(--oro); }
  .filete::before, .filete::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--oro), transparent); }
  .filete svg { width: 18px; height: 18px; flex: none; }

  .texto { font-size: clamp(1.1rem, .98rem + .45vw, 1.3rem); line-height: 1.72; hyphens: auto; -webkit-hyphens: auto; }
  .texto p { margin: 0 0 1.05em; text-align: justify; text-justify: inter-word; }
  .texto h2 {
    font-family: var(--serif-titulo); color: var(--granate); font-weight: 700;
    font-size: clamp(1.5rem, 1.15rem + 1.4vw, 2rem); line-height: 1.2;
    margin: 1.6em 0 .55em; text-align: center;
  }
  .texto h3 {
    font-family: var(--serif-titulo); color: var(--granate); font-weight: 600;
    font-size: clamp(1.25rem, 1.05rem + .8vw, 1.5rem); margin: 1.3em 0 .45em;
  }
  .texto blockquote {
    margin: 1.4em 0; padding: .4em 1.2em; text-align: center; font-style: italic; color: var(--tinta-suave);
    border-left: 0; position: relative;
  }
  .texto blockquote::before, .texto blockquote::after {
    content: ""; display: block; width: 60px; height: 1px; background: var(--oro); margin: .4em auto;
  }
  .texto ul, .texto ol { margin: 0 0 1.05em; padding-left: 1.4em; }
  .texto li { margin: .25em 0; }
  .texto ul li::marker { color: var(--oro); }
  .texto ol li::marker { color: var(--granate); font-weight: 600; }
  .texto figure { margin: 1.6em 0; text-align: center; }
  .texto figure img { max-width: 100%; height: auto; border-radius: 4px; box-shadow: 0 10px 30px rgba(42,36,32,.22); }
  .texto figcaption { margin-top: .6em; font-size: .9em; font-style: italic; color: var(--tinta-suave); }
  .texto strong { font-weight: 600; color: #1d1814; }

  .firma { text-align: right; margin-top: 2.2em; }
  .firma .nombre { font-family: var(--serif-titulo); font-size: 1.45em; font-weight: 600; color: var(--granate); margin: 0; }
  .firma .cargo { font-style: italic; color: var(--tinta-suave); margin: 0; }

  /* Subrayado dorado que se dibuja al aparecer */
  .u {
    background-image: linear-gradient(var(--oro), var(--oro));
    background-repeat: no-repeat; background-position: 0 92%;
    background-size: 0% 2px;
    transition: background-size .7s ease .25s, opacity .6s ease, transform .6s ease, filter .6s ease;
    padding-bottom: 1px;
  }
  .u.visible { background-size: 100% 2px; }

  /* Aparición palabra a palabra */
  .w, .bloque-anim { opacity: 0; display: inline; transition: opacity .6s ease, filter .6s ease; filter: blur(3px); }
  .bloque-anim { display: block; transform: translateY(10px); transition: opacity 1s ease, transform 1s ease, filter 1s ease; }
  .w.visible, .bloque-anim.visible { opacity: 1; filter: none; transform: none; }

  /* Acciones finales */
  .acciones { margin-top: 2.6em; padding-top: 1.6em; border-top: 1px solid var(--papel-borde); text-align: center; }
  .acciones p { margin: 0 0 14px; color: var(--tinta-suave); font-style: italic; }
  .acciones .grupo { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .acciones button {
    font-family: var(--serif-titulo); font-size: 1.05rem; font-weight: 600; letter-spacing: .06em;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 22px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--granate); background: var(--granate); color: var(--papel);
    transition: background .2s ease, color .2s ease;
  }
  .acciones button.secundario { background: transparent; color: var(--granate); }
  .acciones button:hover { background: #5e1621; color: var(--papel); }
  .acciones svg { width: 18px; height: 18px; }

  /* Barra flotante */
  .barra {
    position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 40;
    transform: translate(-50%, 140%); transition: transform .8s ease;
    display: flex; gap: 4px; padding: 6px;
    background: rgba(43,10,16,.88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(216,191,138,.35); border-radius: 999px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .barra.activa { transform: translate(-50%, 0); }
  .barra button {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--serif-titulo); font-size: 1rem; font-weight: 600; letter-spacing: .04em;
    color: #f3e8d2; background: transparent; border: 0; border-radius: 999px;
    padding: 9px 14px; cursor: pointer; white-space: nowrap;
  }
  .barra button:hover { background: rgba(216,191,138,.16); }
  .barra button[aria-pressed="false"] { color: #a8957a; }
  .barra svg { width: 18px; height: 18px; flex: none; }
  .barra .oculto { display: none; }

  .aviso {
    position: fixed; left: 50%; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 70px); z-index: 45;
    transform: translateX(-50%); background: var(--papel); color: var(--granate);
    font-family: var(--serif-titulo); font-weight: 600; font-size: 1.05rem;
    padding: 10px 20px; border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
    opacity: 0; pointer-events: none; transition: opacity .35s ease;
  }
  .aviso.visible { opacity: 1; }

  @keyframes aparecer { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  @media (max-width: 560px) {
    .barra button .etiqueta { display: none; }
    .barra button { padding: 11px 14px; }
    .texto p { text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) {
    .w, .bloque-anim, .u, #portada, .barra { transition: none !important; }
    .sello { animation: none; }
  }
  @media print {
    body { background: #fff; }
    #portada, .barra, .acciones, .aviso { display: none !important; }
    .carta { box-shadow: none; }
    .w, .bloque-anim { opacity: 1 !important; filter: none !important; transform: none !important; }
    .u { background-size: 100% 2px !important; }
  }
</style>
</head>

erciben la necesidad de afecto sincero, porque la tecnología puede imitar la empatía, pero no sustituye la auténtica cercanía humana. Algunos de ustedes conocen la soledad, la desilusión o el temor de no estar a la altura».\n\n¿No os parece que los jóvenes están esperando de la parroquia, de cada uno de nosotros, una respuesta, una palabra, una luz?\n\nOs confieso que, desde el pasado 17 de octubre, día en que se reunió el Consejo Pastoral de la parroquia, no ha pasado un solo día sin que haya dado vueltas, en mi cabeza y en mi oración, al tema principal sobre el que dialogamos en esa reunión: tenemos que hacer algo para acoger a los jóvenes en nuestra parroquia y conducirlos a Jesucristo.\n\nUN CURSO CON SIGNOS\n\nEn este curso 2026-2027 van a tener lugar, además, algunos acontecimientos especiales relacionados con los jóvenes:\n\n• La Oración con el Obispo (OCEO). No sé si sabéis que la Delegación de Juventud de nuestra diócesis organiza todos los meses una Hora Santa presidida por D. Ginés, a la que están invitados los jóvenes de todas las parroquias de la diócesis. Se celebra cada vez en una de las 127 parroquias, y la del viernes 8 de enero de 2027 tendrá lugar precisamente en la nuestra.\n• La Peregrinación Europea de Jóvenes (PEJ) en Santiago de Compostela, el próximo mes de julio.\n• La Jornada Mundial de la Juventud (JMJ) en Seúl (Corea del Sur), en agosto.\n\nIr hasta Corea es más complicado y caro, pero tengo la esperanza de que un buen grupo de jóvenes de Pinto pueda participar en la «PEJ».\n\nComparto con vosotros que percibo en estos acontecimientos signos que nos hablan de un deseo de Dios: que nuestra parroquia salga a buscar a tantos jóvenes que no le conocen.\n\nDOS PROPUESTAS\n\nPara responder a estos signos, os quiero hacer dos propuestas:\n\n1. Que recemos por los jóvenes: por todos los jóvenes del mundo, por los de nuestro pueblo de Pinto, por los de nuestras familias, por los que han pasado por nuestra parroquia para hacer la Primera Comunión, por los que de vez en cuando se pasan para lo que sea, por los que nunca han puesto un pie en nuestra preciosa iglesia… Con nuestra oración ya estamos saliendo a buscarlos.\n2. Que invitemos a los jóvenes mayores de 18 años que conozcamos a un encuentro el próximo viernes 20 de noviembre, después de la misa de 19.00, en la sacristía de Santo Domingo de Silos. En ese encuentro (con sus tres ingredientes principales: una breve oración, una reunión interesante y unas buenas pizzas para cenar) comentaremos el mensaje del Papa del que os hablaba antes, y tendremos la oportunidad de entrar con los jóvenes en un diálogo de confianza, en el que podamos escucharles y proponerles acciones concretas.\n\nNo sabemos cuántos vendrán ni qué saldrá de esa reunión; lo ponemos en manos de la Santísima Virgen. En cualquier caso, no permanezcamos indiferentes ante tantos jóvenes que tienen sed de auténtica felicidad, de sentido para sus vidas, de comunión en el amor, de compromiso con el mundo. Aunque muchos no lo sepan, todo eso es sed de Dios, de una amistad personal con Él.\n\nNosotros llevamos ese tesoro en vasijas de barro, y Jesucristo nos ha enviado al mundo con la misión de comunicarlo a toda la Humanidad.\n\n* * *\n\nOs envío a todos la bendición de Dios y un fuerte abrazo.\n\nP. Charlie\nPárroco\n","archivo":"llamamiento-a-los-jovenes.txt"}</script>

    if (b.t === "h") {
      el = document.createElement(b.nivel === 3 ? "h3" : "h2"); T.appendChild(el);
      finBloque(V * 3); palabras(el, b.seg); finBloque(V * 5);
    } else if (b.t === "p" || b.t === "cita") {
      el = document.createElement(b.t === "p" ? "p" : "blockquote"); T.appendChild(el);
      palabras(el, b.seg); finBloque(V * 4);
    } else if (b.t === "lista") {
      el = document.createElement(b.ordenada ? "ol" : "ul"); T.appendChild(el);
      b.items.forEach(function (it) {
        var li = document.createElement("li"); el.appendChild(li);
        palabras(li, it); finBloque(V * 2.5);
      });
      finBloque(V * 2);
    } else if (b.t === "img") {
      el = document.createElement("figure"); el.className = "bloque-anim";
      var img = document.createElement("img"); img.src = b.src; img.alt = b.pie || ""; img.loading = "lazy";
      el.appendChild(img);
      if (b.pie) { var fc = document.createElement("figcaption"); fc.textContent = b.pie; el.appendChild(fc); }
      T.appendChild(el); cola.push({ el: el, pausa: V * 10 });
    } else if (b.t === "sep") {
      el = document.createElement("div"); el.className = "filete bloque-anim"; el.setAttribute("aria-hidden", "true");
      el.innerHTML = '<svg><use href="#i-rombo"/></svg>';
      T.appendChild(el); cola.push({ el: el, pausa: V * 5 });
    }
  });
  if (D.firma || D.cargo) {
    var f = document.createElement("div"); f.className = "firma bloque-anim";
    if (D.firma) { var n = document.createElement("p"); n.className = "nombre"; n.textContent = D.firma; f.appendChild(n); }
    if (D.cargo) { var c = document.createElement("p"); c.className = "cargo"; c.textContent = D.cargo; f.appendChild(c); }
    T.appendChild(f); cola.push({ el: f, pausa: V * 6 });
  }
  cola.push({ el: $("acciones"), pausa: 0 });

  /* ---------- Aparición progresiva ---------- */
  var indice = 0, temporizador = null, seguir = true, terminado = false;
  function mostrar(el) { el.classList.add("visible"); }
  function acompañar(el) {
    var r = el.getBoundingClientRect(), alto = window.innerHeight;
    if (!seguir) { if (r.bottom > 0 && r.bottom < alto * 0.85) seguir = true; else return; }
    if (r.bottom > alto * 0.72) window.scrollBy({ top: r.bottom - alto * 0.55, behavior: reducido ? "auto" : "smooth" });
  }
  function siguiente() {
    if (indice >= cola.length) { acabar(); return; }
    var item = cola[indice++];
    mostrar(item.el);
    if (item.el.querySelectorAll) item.el.querySelectorAll(".w").forEach(mostrar);
    acompañar(item.el);
    temporizador = setTimeout(siguiente, item.pausa);
  }
  function acabar() {
    terminado = true; clearTimeout(temporizador);
    for (; indice < cola.length; indice++) mostrar(cola[indice].el);
    document.querySelectorAll(".w").forEach(mostrar);
    $("b-todo").classList.add("oculto");
  }
  ["wheel", "touchmove"].forEach(function (ev) { window.addEventListener(ev, function () { if (!terminado) seguir = false; }, { passive: true }); });
  window.addEventListener("keydown", function (e) { if (/^(Arrow|Page|Home|End| )/.test(e.key)) seguir = false; });
  $("b-todo").addEventListener("click", acabar);

  /* ---------- Música ---------- */
  var musica = { sonando: false, audio: null, ctx: null, maestro: null, plan: null };
  function fundido(audio, hasta, ms, alFinal) {
    var desde = audio.volume, t0 = performance.now();
    (function paso(t) {
      var k = Math.min(1, (t - t0) / ms);
      audio.volume = Math.max(0, Math.min(1, desde + (hasta - desde) * k));
      if (k < 1) requestAnimationFrame(paso); else if (alFinal) alFinal();
    })(t0);
  }
  // Órgano suave sintetizado (se usa si no hay archivo de música)
  function crearOrgano() {
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    var ctx = new AC();
    var maestro = ctx.createGain(); maestro.gain.value = 0;
    var filtro = ctx.createBiquadFilter(); filtro.type = "lowpass"; filtro.frequency.value = 1600; filtro.Q.value = .3;
    var conv = ctx.createConvolver(), dur = 4, len = ctx.sampleRate * dur, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (var ch = 0; ch < 2; ch++) { var d = ir.getChannelData(ch); for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    conv.buffer = ir;
    var seco = ctx.createGain(); seco.gain.value = .55; var humedo = ctx.createGain(); humedo.gain.value = .65;
    maestro.connect(filtro); filtro.connect(seco); filtro.connect(conv); conv.connect(humedo);
    seco.connect(ctx.destination); humedo.connect(ctx.destination);
    var hz = function (m) { return 440 * Math.pow(2, (m - 69) / 12); };
    // Re mayor: I – vi – IV – V – I – IV – ii – V
    var acordes = [[50,57,62,66],[47,54,59,62],[43,55,62,67],[45,52,61,64],[50,57,62,66],[43,55,59,67],[40,52,59,64],[45,52,57,61]];
    var melodia = [74,71,74,73,74,71,71,73];
    var D_AC = 7, n = 0, proximo = ctx.currentTime + .1;
    function voz(f, t, d, vol, tipo) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = tipo; o.frequency.value = f; o.detune.value = (Math.random() - .5) * 6;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 2.2);
      g.gain.setValueAtTime(vol, t + d - .2); g.gain.linearRampToValueAtTime(0, t + d + 2.6);
      o.connect(g); g.connect(maestro); o.start(t); o.stop(t + d + 2.8);
    }
    function campana(f, t) {
      var o = ctx.createOscillator(), g = ctx.createGain(); o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.05, t + .04); g.gain.exponentialRampToValueAtTime(.0001, t + 4.5);
      o.connect(g); g.connect(maestro); o.start(t); o.stop(t + 4.6);
    }
    function programar() {
      while (proximo < ctx.currentTime + 4) {
        var a = acordes[n % acordes.length];
        a.forEach(function (m) { voz(hz(m), proximo, D_AC, .045, "sine"); voz(hz(m) * 2, proximo, D_AC, .012, "triangle"); });
        voz(hz(a[0] - 12), proximo, D_AC, .05, "sine");
        if (n % 2 === 1) campana(hz(melodia[n % melodia.length]), proximo + D_AC * .5);
        proximo += D_AC; n++;
      }
    }
    programar();
    musica.plan = setInterval(programar, 1000);
    musica.ctx = ctx; musica.maestro = maestro;
    return ctx;
  }
  function volumenObjetivo() { return typeof D.volumen === "number" ? D.volumen : .35; }
  function encender() {
    if (D.musica) {
      if (!musica.audio) { musica.audio = new Audio(D.musica); musica.audio.loop = true; musica.audio.volume = 0; }
      var p = musica.audio.play(); if (p && p.catch) p.catch(function () { marcar(false); });
      fundido(musica.audio, volumenObjetivo(), 3000);
    } else {
      if (!musica.ctx && !crearOrgano()) return;
      musica.ctx.resume();
      var g = musica.maestro.gain, t = musica.ctx.currentTime;
      g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(volumenObjetivo() * 1.6, t + 3);
    }
    marcar(true);
  }
  function apagar() {
    if (musica.audio) fundido(musica.audio, 0, 800, function () { musica.audio.pause(); });
    if (musica.ctx) {
      var g = musica.maestro.gain, t = musica.ctx.currentTime;
      g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(0, t + .8);
      setTimeout(function () { if (!musica.sonando) musica.ctx.suspend(); }, 900);
    }
    marcar(false);
  }
  function marcar(si) { musica.sonando = si; $("b-musica").setAttribute("aria-pressed", si ? "true" : "false"); $("b-musica").title = si ? "Silenciar la música" : "Activar la música"; }
  $("b-musica").addEventListener("click", function () { musica.sonando ? apagar() : encender(); });
  var pausadaPorOcultar = false;
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && musica.sonando) { pausadaPorOcultar = true; apagar(); }
    else if (!document.hidden && pausadaPorOcultar) { pausadaPorOcultar = false; encender(); }
  });

  /* ---------- Copiar y descargar ---------- */
  var avisoT;
  function aviso(txt) { var a = $("aviso"); a.textContent = txt; a.classList.add("visible"); clearTimeout(avisoT); avisoT = setTimeout(function () { a.classList.remove("visible"); }, 2200); }
  function copiar() {
    var hecho = function () { aviso("Texto copiado"); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(D.texto).then(hecho, copiaAntigua);
    } else copiaAntigua();
    function copiaAntigua() {
      var ta = document.createElement("textarea"); ta.value = D.texto; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); hecho(); } catch (e) { aviso("No se pudo copiar"); }
      ta.remove();
    }
  }
  function descargar() {
    var blob = new Blob(["﻿" + D.texto.replace(/\n/g, "\r\n")], { type: "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = D.archivo || "mensaje.txt"; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
    aviso("Descargando el mensaje");
  }
  document.querySelectorAll("[data-accion]").forEach(function (b) {
    b.addEventListener("click", b.getAttribute("data-accion") === "copiar" ? copiar : descargar);
  });

  /* ---------- Apertura ---------- */
  $("abrir").addEventListener("click", function () {
    $("portada").classList.add("fuera");
    document.body.classList.remove("cerrado");
    $("barra").classList.add("activa");
    window.scrollTo(0, 0);
    encender();
    if (reducido) acabar(); else setTimeout(siguiente, 1400);
  });
  $("abrir").focus();
})();
</script>
